# All automated tests use an isolated local database, never the configured Neon DB.
spring.datasource.url=jdbc:h2:mem:purchase;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:purchase-schema.sql
spring.main.banner-mode=off
app.product-sales.scheduler-enabled=false
# Bí mật trong application.yml không còn giá trị mặc định; test dùng giá trị giả
app.jwt.secret=test_only_jwt_secret_key_at_least_32_bytes_long
app.ai.api-key=
# Test tích hợp dùng chung context và cùng IP 127.0.0.1: bỏ giới hạn tần suất; PcBuildControllerTest tự đặt 6/30
app.pcbuild.rate-limit-per-minute=100000
app.pcbuild.rate-limit-check-per-minute=100000
# AC13: đếm số câu SQL trong test tích hợp pcbuild
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
