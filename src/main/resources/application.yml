spring:
  application:
    name: cybershop

  # ==========================================
  # DATABASE (Local Docker PostgreSQL)
  # ==========================================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cybershop}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    # Cloud Neon (Uncomment if needed):
    # url: jdbc:postgresql://ep-still-shape-b33guhgd-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require
    # username: neondb_owner
    # password: npg_E3lTM5aYOpNA
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Bangkok'

  # ==========================================
  # JPA / HIBERNATE
  # ==========================================
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ==========================================
# SERVER
# ==========================================
server:
  port: 8080

# ==========================================
# JWT & AI ENGINE
# ==========================================
app:
  jwt:
    secret: cybershop_super_secret_jwt_key_2026_sba301_project_dev
    expiration-ms: 86400000
  ai:
    provider: gemini
    api-key: ${AI_API_KEY:AIzaSyC0YE_xzWNMkSMTK5vcEAqhAZYL8X4a7zk}
    model: gemini-flash-lite-latest
    timeout-ms: 8000